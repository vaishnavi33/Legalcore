# One-click free preview on Render: https://render.com/deploy?repo=https://github.com/vaishnavi33/Legalcore
# Creates a PostgreSQL database, the API and the website. Free services sleep after 15 minutes without
# visitors and take about a minute to wake up. Free databases expire after 30 days.
# The preview loads demo accounts and sample requests. Do not use it for real client data.
databases:
  - name: legalcore-db
    plan: free
    databaseName: legalcore
    user: legalcore

services:
  - type: web
    name: legalcore-api-vaishnavi33
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed --demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: preview
      - key: DATABASE_URL
        fromDatabase:
          name: legalcore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/legalcore-uploads

  - type: web
    name: legalcore-web-vaishnavi33
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # If Render gives the API a different address, change this value. No rebuild is needed.
      - key: API_URL
        value: https://legalcore-api-vaishnavi33.onrender.com
