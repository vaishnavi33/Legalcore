name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legalcore
          POSTGRES_PASSWORD: legalcore
          POSTGRES_DB: legalcore_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://legalcore:legalcore@localhost:5432/legalcore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the all-in-one preview image
        run: docker build -t legalcore-preview .
      - name: Start it and check the website and API answer
        run: |
          docker run -d --name lc -p 10000:10000 -e COOKIE_SECURE=false legalcore-preview
          for i in $(seq 1 60); do curl -sf localhost:10000/api/health && break; sleep 2; done
          curl -sf localhost:10000/api/health
          curl -sf -o /dev/null localhost:10000/
          docker logs lc | tail -20
      - name: Build the production images
        run: docker build -t legalcore-api backend && docker build -t legalcore-web frontend
